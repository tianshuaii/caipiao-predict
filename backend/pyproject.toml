[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0,<3", "pymysql[rsa]>=1.1,<2", "alembic>=1.14,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2", "apscheduler>=3.11,<4", "numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
lottery = "lottery.cli:main"

[tool.setuptools.packages.find]
include = ["lottery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
